name: familia-cashflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: familia
      POSTGRES_USER: familia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U familia -d familia']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgres://familia:${POSTGRES_PASSWORD}@postgres:5432/familia
      CORS_ORIGINS: http://localhost:8081
      # O nginx do front é o único proxy na frente da API.
      TRUST_PROXY: 'true'
      RUST_LOG: info,sqlx=warn
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: web
    ports:
      - '127.0.0.1:8081:8081'
    depends_on:
      - api

volumes:
  pgdata:
